name: Check WeChat publisher upstream

on:
  schedule:
    - cron: "23 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out article-editor
        uses: actions/checkout@v4

      - name: Compare upstream, fork, stable branch, and lock
        run: bash scripts/check-wechat-upstream.sh
